name: CI/CD Pipeline

on:
  push:
    branches: [ develop, "release/*", main ]
  pull_request:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------- CI: Validation --------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML and CSS
        run: |
          echo "Verifying project structure..."
          [ -d "./html" ] && [ -d "./css" ] || (echo "Error: Required folders missing"; exit 1)

  # -------------------- CI: Build & Push --------------------
  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name to Lowercase
        # Fixes potential Docker build errors from uppercase repo names
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  # -------------------- CD: Deploy to Development --------------------
  deploy-development:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
    steps:
      - name: Trigger Render Deploy - Development
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_DEV_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

  # -------------------- CD: Deploy to Staging --------------------
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: staging
    steps:
      - name: Trigger Render Deploy - Staging
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

  # -------------------- CD: Deploy to Production --------------------
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Trigger Render Deploy - Production
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_PROD_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"